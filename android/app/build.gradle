plugins {
    id 'com.android.application'
}

android {
    namespace 'com.opencode.mapgen'
    compileSdk 35

    defaultConfig {
        applicationId 'com.opencode.mapgen'
        minSdk 23
        targetSdk 34
        versionCode 13
        versionName '0.2.11'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            zipAlignEnabled false
        }
        release {
            minifyEnabled false
            zipAlignEnabled false
            signingConfig signingConfigs.debug
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
